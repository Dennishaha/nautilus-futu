[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "nautilus-futu"
version = "0.1.2"
description = "Independent NautilusTrader v2 adapter for Futu OpenD"
requires-python = ">=3.13,<3.15"
readme = "README.md"
license = "MIT"
authors = [{name = "Dennishaha"}]
dependencies = ["nautilus_trader==2.0.0rc8", "futu-api==10.11.7108"]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "pytest-asyncio>=0.24,<1", "ruff>=0.9,<1", "mypy>=1.13,<2", "build>=1.2,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nautilus_futu = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["opend: explicitly enabled read-only OpenD checks"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.13"
check_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true
