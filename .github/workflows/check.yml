name: Connector checks
on: [push, pull_request]
jobs:
  offline:
    runs-on: macos-latest
    strategy:
      matrix:
        python: ['3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --extra dev --python '${{ matrix.python }}'
      - run: uv run --no-sync pytest -q
      - run: uv run --no-sync ruff check src tests examples scripts
      - run: uv run --no-sync ruff format --check src tests examples scripts
      - run: uv run --no-sync mypy src examples scripts
      - run: uv run --no-sync python -m build
